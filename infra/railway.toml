# Railway multi-service configuration
# Chaque service a son propre Dockerfile et contexte de build

# Note: Railway détecte automatiquement les services via docker-compose.yml
# ou via l'interface Railway. Ce fichier sert de documentation.

# Services:
# 1. bot     — Discord bot + player audio (services/bot/)
# 2. api     — REST API + WebSocket (services/api/)
# 3. web     — Frontend Next.js (services/web/)
# 4. redis   — Redis plugin (ajouter via l'interface Railway)

# Variables d'env partagées (à configurer dans Railway):
# - REDIS_URL (auto-rempli par le plugin Redis)
# - DISCORD_TOKEN
# - DISCORD_CLIENT_ID
# - DISCORD_CLIENT_SECRET
# - GREG_OWNER_ID
# - FLASK_SECRET_KEY
# etc. (voir .env.example)

# Build du bot (services/bot/Dockerfile) :
# - yt-dlp est réinstallé (pip -U) dans une couche invalidée à chaque commit
#   (RAILWAY_GIT_COMMIT_SHA, injecté automatiquement par Railway).
# - Redeploy sans commit : changer YTDLP_REFRESH (ex: la date) pour forcer
#   la mise à jour de yt-dlp, ou NO_CACHE=1 pour reconstruire toute l'image.

# Démarrage de l'API (services/api/Dockerfile) :
# - Start command = CMD du Dockerfile : `python -m api.main` (lance aussi le Redis
#   listener → pushes playlist_update). Ne PAS définir de start command personnalisé
#   (gunicorn / -k eventlet) : non supporté, plus de mises à jour live.

# Build du web (services/web/Dockerfile) :
# - API_URL, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WS_URL sont figées au `next build`
#   (build args) : les changer impose un redeploy du service web.
